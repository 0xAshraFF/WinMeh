[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "winmeh"
version = "0.1.0"
description = "A tiny, fast, local-first glass desktop assistant for Windows."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "PySide6-Essentials>=6.6",
  "psutil>=5.9",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
voice = ["faster-whisper>=1.0", "sounddevice>=0.4", "numpy>=1.24"]
dev = ["pytest>=7", "pyinstaller>=6"]

[project.scripts]
winmeh = "winmeh.__main__:main"

[tool.setuptools.packages.find]
include = ["winmeh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
